results:
- id: R01-1
  kind: core_result
  statement: Separate quantitative counts, quantitative continuous measurements, and
    categorical labels; separate cross-sectional, temporal, and panel observations.
  depends_on: []
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 1
  concrete_tie: Typed features, correlation, scaling, and a nonlinear zero-correlation
    counterexample.
  symbols: plan/notation.md; extended locally in chapter
- id: R01-2
  kind: core_result
  statement: For finite-variance nonconstant real random variables, correlation is
    covariance divided by the product of standard deviations and lies in [-1,1] by
    Cauchy-Schwarz.
  depends_on:
  - R01-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 1
  concrete_tie: Typed features, correlation, scaling, and a nonlinear zero-correlation
    counterexample.
  symbols: plan/notation.md; extended locally in chapter
- id: R02-1
  kind: core_result
  statement: For centered Z and sample covariance S=Z^T Z/(n-1), a unit vector maximizing
    v^T S v is a leading eigenvector of S.
  depends_on:
  - R01-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 2
  concrete_tie: Covariance versus correlation PCA, SVD, explained variance, reconstruction,
    and Python conversion of source R demonstrations.
  symbols: plan/notation.md; extended locally in chapter
- id: R02-2
  kind: core_result
  statement: For an orthogonal rank-k projection onto leading covariance eigenvectors,
    squared reconstruction error equals (n-1) times the sum of discarded eigenvalues;
    tied eigenvalues need subspace rather than signed-vector comparisons.
  depends_on:
  - R02-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 2
  concrete_tie: Covariance versus correlation PCA, SVD, explained variance, reconstruction,
    and Python conversion of source R demonstrations.
  symbols: plan/notation.md; extended locally in chapter
- id: R03-1
  kind: core_result
  statement: In x=mu+Lambda f+u with Cov(f)=I, Cov(u)=Psi and Cov(f,u)=0, Cov(x)=Lambda
    Lambda^T+Psi.
  depends_on:
  - R01-2
  - R02-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 3
  concrete_tie: Factor extraction, rotation, communalities and factor-score conventions;
    inventory and convert all R calls.
  symbols: plan/notation.md; extended locally in chapter
- id: R03-2
  kind: core_result
  statement: For orthogonal Q, Lambda Q and Q^T f preserve the common-factor covariance;
    factor orientation is not identified by covariance alone.
  depends_on:
  - R03-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 3
  concrete_tie: Factor extraction, rotation, communalities and factor-score conventions;
    inventory and convert all R calls.
  symbols: plan/notation.md; extended locally in chapter
- id: R04-1
  kind: core_result
  statement: A partition assigns each observation to exactly one nonempty cluster;
    its usefulness depends on scaling, dissimilarity and the application.
  depends_on:
  - R01-2
  - R02-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 4
  concrete_tie: Hand-trace agglomeration and compare linkage rules on the same scaled
    observations.
  symbols: plan/notation.md; extended locally in chapter
- id: R04-2
  kind: core_result
  statement: Single, complete and average linkage define between-cluster dissimilarity
    respectively by the minimum, maximum and mean pairwise dissimilarities.
  depends_on:
  - R04-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 4
  concrete_tie: Hand-trace agglomeration and compare linkage rules on the same scaled
    observations.
  symbols: plan/notation.md; extended locally in chapter
- id: R05-1
  kind: core_result
  statement: For Euclidean observations, merging clusters A and B increases within-cluster
    squared error by |A||B|/(|A|+|B|) times squared centroid distance.
  depends_on:
  - R04-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 5
  concrete_tie: Translate R hierarchical-clustering examples with explicit Ward conventions,
    distances, labels and cut levels.
  symbols: plan/notation.md; extended locally in chapter
- id: R05-2
  kind: core_result
  statement: A dendrogram cut defines a partition; display leaf order, tie handling
    and reported linkage heights depend on conventions and must be audited separately
    from partition agreement.
  depends_on:
  - R05-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 5
  concrete_tie: Translate R hierarchical-clustering examples with explicit Ward conventions,
    distances, labels and cut levels.
  symbols: plan/notation.md; extended locally in chapter
- id: R06-1
  kind: core_result
  statement: For fixed nonempty assignments, each arithmetic centroid minimizes its
    cluster's sum of squared Euclidean distances.
  depends_on:
  - R04-2
  - R05-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 6
  concrete_tie: Implement Lloyd iterations and compare source initialization/restart
    conventions with Python.
  symbols: plan/notation.md; extended locally in chapter
- id: R06-2
  kind: core_result
  statement: Nearest-centroid assignment and centroid recomputation do not increase
    the k-means objective; this does not guarantee a global minimum.
  depends_on:
  - R06-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 6
  concrete_tie: Implement Lloyd iterations and compare source initialization/restart
    conventions with Python.
  symbols: plan/notation.md; extended locally in chapter
- id: R07-1
  kind: core_result
  statement: When sum_i(x_i-xbar)^2>0, the intercept-and-slope least-squares minimizer
    has slope sum_i(x_i-xbar)(y_i-ybar)/sum_i(x_i-xbar)^2 and intercept ybar minus
    slope times xbar.
  depends_on:
  - R01-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 7
  concrete_tie: Fit a simple model, derive the output, and distinguish mean-response
    from new-observation intervals.
  symbols: plan/notation.md; extended locally in chapter
- id: R07-2
  kind: core_result
  statement: Under fixed nonconstant predictors and independent Gaussian errors with
    common variance, the standardized slope estimator using residual variance with
    n-2 degrees of freedom has a t distribution for n>2.
  depends_on:
  - R07-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 7
  concrete_tie: Fit a simple model, derive the output, and distinguish mean-response
    from new-observation intervals.
  symbols: plan/notation.md; extended locally in chapter
- id: R08-1
  kind: core_result
  statement: For full-column-rank X, the unique least-squares coefficient solves X^T
    X beta_hat=X^T y, and the residual is orthogonal to col(X).
  depends_on:
  - R07-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 8
  concrete_tie: Reproduce multiple-regression examples with QR/SVD-based fits and
    explicit design matrices.
  symbols: plan/notation.md; extended locally in chapter
- id: R08-2
  kind: core_result
  statement: Under E(epsilon|X)=0 and Cov(epsilon|X)=sigma^2 I, beta_hat is conditionally
    unbiased with covariance sigma^2 (X^T X)^-1; Gaussianity is additional for exact
    normal-theory inference.
  depends_on:
  - R08-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 8
  concrete_tie: Reproduce multiple-regression examples with QR/SVD-based fits and
    explicit design matrices.
  symbols: plan/notation.md; extended locally in chapter
- id: R09-1
  kind: core_result
  statement: For a rank-q projection H, 0<=h_ii<=1 and sum_i h_ii=q; a large residual
    and high leverage measure different features of an observation.
  depends_on:
  - R08-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 9
  concrete_tie: Translate source diagnostics and compare residual, leverage, studentization,
    Cook distance, and refits.
  symbols: plan/notation.md; extended locally in chapter
- id: R09-2
  kind: core_result
  statement: If h_ii<1, deleting row i changes its fitted residual into the leave-one-out
    prediction error e_i/(1-h_ii).
  depends_on:
  - R09-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 9
  concrete_tie: Translate source diagnostics and compare residual, leverage, studentization,
    Cook distance, and refits.
  symbols: plan/notation.md; extended locally in chapter
- id: R10-1
  kind: core_result
  statement: With an intercept, K group indicators sum to the intercept column and
    are rank deficient; K-1 treatment indicators identify a baseline parameterization
    when all groups occur.
  depends_on:
  - R08-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 10
  concrete_tie: Convert R formula/factor coding into explicit Python contrasts and
    verify fitted-value equivalence.
  symbols: plan/notation.md; extended locally in chapter
- id: R10-2
  kind: core_result
  statement: Changing a full-rank basis for the same design-column space changes coefficients
    but preserves fitted values and residuals.
  depends_on:
  - R10-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 10
  concrete_tie: Convert R formula/factor coding into explicit Python contrasts and
    verify fitted-value equivalence.
  symbols: plan/notation.md; extended locally in chapter
- id: R11-1
  kind: core_result
  statement: A model polynomial in an observed predictor can remain linear in its
    regression coefficients.
  depends_on:
  - R08-2
  - R10-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 11
  concrete_tie: Convert R transformations and interactions; compare centered and uncentered
    equivalent fits.
  symbols: plan/notation.md; extended locally in chapter
- id: R11-2
  kind: core_result
  statement: For conditional mean beta0+beta1 x+beta2 z+beta3 xz, the partial effect
    with respect to x is beta1+beta3 z; main effects depend on the chosen reference
    values.
  depends_on:
  - R11-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 11
  concrete_tie: Convert R transformations and interactions; compare centered and uncentered
    equivalent fits.
  symbols: plan/notation.md; extended locally in chapter
- id: R12-1
  kind: core_result
  statement: With full-rank fixed X and conditional mean-zero errors, dependence alone
    does not bias OLS; covariance is (X^T X)^-1 X^T Omega X (X^T X)^-1.
  depends_on:
  - R08-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 12
  concrete_tie: Audit source dependence tests and simulate the difference between
    coefficient behavior and invalid iid standard errors.
  symbols: plan/notation.md; extended locally in chapter
- id: R12-2
  kind: core_result
  statement: The Durbin-Watson statistic is sum_{i=2}^n(e_i-e_{i-1})^2 divided by
    sum_i e_i^2; its calibration depends on the regression and ordering assumptions.
  depends_on:
  - R12-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 12
  concrete_tie: Audit source dependence tests and simulate the difference between
    coefficient behavior and invalid iid standard errors.
  symbols: plan/notation.md; extended locally in chapter
- id: R13-1
  kind: core_result
  statement: Normality of errors is not required for OLS's algebraic projection or
    conditional unbiasedness.
  depends_on:
  - R08-2
  - R12-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 13
  concrete_tie: Convert source tests and Q-Q diagnostics, record test variants, and
    compare heavy tails with influential observations.
  symbols: plan/notation.md; extended locally in chapter
- id: R13-2
  kind: core_result
  statement: Under Gaussian homoscedastic errors, Cov(e|X)=sigma^2(I-H); regression
    residuals are generally dependent and have unequal marginal variances, so an iid
    normality-test interpretation needs qualification.
  depends_on:
  - R13-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 13
  concrete_tie: Convert source tests and Q-Q diagnostics, record test variants, and
    compare heavy tails with influential observations.
  symbols: plan/notation.md; extended locally in chapter
- id: R14-1
  kind: core_result
  statement: Exact column dependence destroys unique coefficient identification; near
    dependence can make coefficients unstable even when fitted values are stable.
  depends_on:
  - R08-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 14
  concrete_tie: Convert source VIF/collinearity diagnostics and inspect singular values,
    coefficient perturbations and predictions.
  symbols: plan/notation.md; extended locally in chapter
- id: R14-2
  kind: core_result
  statement: With an intercept and full rank, variance of slope j under homoscedastic
    errors is sigma^2/[Sxx_j(1-R_j^2)], where R_j^2 is the auxiliary regression fit
    of that predictor on the others.
  depends_on:
  - R14-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 14
  concrete_tie: Convert source VIF/collinearity diagnostics and inspect singular values,
    coefficient perturbations and predictions.
  symbols: plan/notation.md; extended locally in chapter
- id: R15-1
  kind: core_result
  statement: If Omega is known positive definite, minimizing (y-X beta)^T Omega^-1(y-X
    beta) gives generalized least squares with covariance (X^T Omega^-1 X)^-1 under
    conditional mean-zero errors.
  depends_on:
  - R08-2
  - R12-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 15
  concrete_tie: Translate heteroscedasticity tests, weighted fits and covariance conventions;
    compare fitted means and uncertainty.
  symbols: plan/notation.md; extended locally in chapter
- id: R15-2
  kind: core_result
  statement: OLS covariance with nonconstant error variances uses a sandwich form;
    a sample residual-based estimate requires explicit large-sample conditions and
    a named finite-sample correction.
  depends_on:
  - R15-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 15
  concrete_tie: Translate heteroscedasticity tests, weighted fits and covariance conventions;
    compare fitted means and uncertainty.
  symbols: plan/notation.md; extended locally in chapter
- id: R16-1
  kind: core_result
  statement: A fitted prediction procedure includes preprocessing and model selection;
    held-out performance estimates require evaluating the complete procedure without
    fitting these steps on the held-out outcomes.
  depends_on:
  - R08-2
  - R09-2
  - R10-2
  - R11-2
  - R12-2
  - R13-2
  - R14-2
  - R15-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 16
  concrete_tie: Convert all source case-study and selection examples; add a clearly
    labeled leakage-safe Python evaluation.
  symbols: plan/notation.md; extended locally in chapter
- id: R16-2
  kind: core_result
  statement: AIC and prediction error answer different questions; selecting on the
    test set invalidates its intended role as an untouched assessment sample.
  depends_on:
  - R16-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 16
  concrete_tie: Convert all source case-study and selection examples; add a clearly
    labeled leakage-safe Python evaluation.
  symbols: plan/notation.md; extended locally in chapter
- id: R17-1
  kind: core_result
  statement: If logit P(Y=1|x)=x^T beta, increasing feature j by one unit with all
    other design coordinates fixed multiplies the odds by exp(beta_j); it does not
    generally multiply probability by that amount.
  depends_on:
  - R08-2
  - R16-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 17
  concrete_tie: Convert source odds/logistic examples, disable unintended penalties,
    and compare likelihood, uncertainty, calibration and thresholds.
  symbols: plan/notation.md; extended locally in chapter
- id: R17-2
  kind: core_result
  statement: For independent Bernoulli responses the logistic log-likelihood has gradient
    X^T(y-pi) and Hessian -X^T W X, W_ii=pi_i(1-pi_i); separation may prevent a finite
    unpenalized maximum.
  depends_on:
  - R17-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 17
  concrete_tie: Convert source odds/logistic examples, disable unintended penalties,
    and compare likelihood, uncertainty, calibration and thresholds.
  symbols: plan/notation.md; extended locally in chapter
- id: R18-1
  kind: core_result
  statement: For sharp treatment D=1{r>=c}, continuity at c of both conditional potential-outcome
    means and appropriate support identify the jump in E(Y|r) as the treatment effect
    at the cutoff.
  depends_on:
  - R10-2
  - R11-2
  - R15-2
  - R16-2
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 18
  concrete_tie: Convert any source cutoff example; implement a labeled synthetic sharp-design
    demonstration with sensitivity checks, without claiming formal robust-bias-corrected
    inference.
  symbols: plan/notation.md; extended locally in chapter
- id: R18-2
  kind: core_result
  statement: A fitted jump is not causal without the identification assumptions; local
    polynomial estimation additionally depends on bandwidth, specification and an
    appropriate uncertainty calculation.
  depends_on:
  - R18-1
  status: implemented_in_chapter_with_two_current_independent_reviews
  planned_chapter: 18
  concrete_tie: Convert any source cutoff example; implement a labeled synthetic sharp-design
    demonstration with sensitivity checks, without claiming formal robust-bias-corrected
    inference.
  symbols: plan/notation.md; extended locally in chapter
